<!DOCTYPE html>
<html lang="en">
<head>

<body>

<header class="site-header">
  <a class="site-title" href="index.html"><img src="public/logo.svg" alt="— Adrian" width="66" height="27"></a>
  <button type="button" class="menu-toggle" data-menu-toggle aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu">
    <span class="menu-toggle-bar"></span>
    <span class="menu-toggle-bar"></span>
  </button>
  <nav class="primary-nav" aria-label="Primary">
    <a href="index.html" class="nav-link">Work</a>
    <a href="people.html" class="nav-link is-active">People</a>
    <a href="about.html" class="nav-link">About</a>
  </nav>
</header>

<nav class="mobile-menu" id="mobile-menu" data-mobile-menu aria-label="Mobile" hidden>
    <a href="index.html" class="mobile-nav-link">Work</a>
    <a href="people.html" class="mobile-nav-link is-active">People</a>
    <a href="about.html" class="mobile-nav-link">About</a>
</nav>

<main class="site-page">

  <section class="hero">
    <h1 class="hero-description">Shaping and influencing<br>the culture.</h1>
  </section>

  <section class="work-index" aria-label="Selected people work">
    <ul class="work-list">
      <li class="work-item"><a href="people/aigaspotlight.html"><span class="work-index-number">01</span><span class="work-index-title">AIGA Mentor Spotlight</span><span class="work-index-arrow" aria-hidden="true">&rarr;</span></a></li>

    </ul>
  </section>

</main>

<footer class="site-footer">
  <span class="site-title">
    <img src="public/adriansito-portrait.png" alt="— Adrian" width="1254" height="1254">
    <span class="footer-identity">
      <span class="footer-name">Adrian Aguilar</span>
      <span class="footer-location">Los Angeles</span>
    </span>
  </span>
  <span class="footer-status" data-footer-status><span class="footer-status-dot" aria-hidden="true"></span><span data-footer-status-text>Currently designing</span></span>
</footer>

<script>
(function () {
  var el = document.querySelector("[data-footer-status-text]");
  if (!el) return;
  var hour = Number(
    new Intl.DateTimeFormat("en-US", { timeZone: "America/Los_Angeles", hour: "numeric", hour12: false }).format(new Date())
  );
  var text = "Currently sleeping";
  if (hour >= 9 && hour < 17) {
    text = "Currently designing";
  } else if (hour >= 17 && hour < 20) {
    text = "Currently playing tennis";
  }
  el.textContent = text;
})();
</script>


<script>
(function () {
  var toggle = document.querySelector("[data-menu-toggle]");
  var menu = document.querySelector("[data-mobile-menu]");
  if (!toggle || !menu) return;

  function setOpen(open) {
    menu.hidden = !open;
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
    toggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
    document.documentElement.classList.toggle("menu-open", open);
  }

  toggle.addEventListener("click", function () {
    setOpen(menu.hidden);
  });

  menu.querySelectorAll("a").forEach(function (link) {
    link.addEventListener("click", function () { setOpen(false); });
  });
})();
</script>
</body>
</html>
