<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>— Adrian</title>
<link rel="icon" href="public/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="gate">
  <div class="gate-card">
    <img class="gate-logo" src="public/logo.svg" alt="— Adrian" width="120" height="49">

    <form class="gate-form" data-gate-form novalidate>
      <label class="gate-label" for="gate-password">Password</label>
      <input
        class="gate-input"
        type="password"
        id="gate-password"
        name="password"
        placeholder="Please enter password"
        autocomplete="off"
        autofocus
      >
      <p class="gate-error" data-gate-error hidden>Incorrect password. Try again.</p>
      <button type="submit" class="btn-brutal gate-submit">Enter</button>
    </form>
  </div>
</main>

<script>
(function () {
  var CORRECT = "Adrian";
  var form = document.querySelector("[data-gate-form]");
  var input = document.getElementById("gate-password");
  var error = document.querySelector("[data-gate-error]");

  function getRedirect() {
    var params = new URLSearchParams(window.location.search);
    return params.get("redirect") || "index.html";
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (input.value === CORRECT) {
      sessionStorage.setItem("adrian-site-auth", "true");
      window.location.replace(getRedirect());
    } else {
      error.hidden = false;
      input.value = "";
      input.focus();
    }
  });
})();
</script>

</body>
</html>
